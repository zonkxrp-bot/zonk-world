:root{--yellow:#ffd51b;--purple:#d000ff;--bg:#09060e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(ellipse at 50% 25%,#360044 0,transparent 45%),var(--bg);font-family:Arial,Helvetica,sans-serif}
main{width:min(100%,720px)}.brand{color:var(--yellow);font-weight:900;letter-spacing:.24em}

.buy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,490px);margin:0 auto 22px}

.socials{display:flex;justify-content:center;gap:12px;margin-bottom:23px}
.social{color:white;text-decoration:none;border:1px solid #9c00bf;padding:10px 20px;border-radius:99px;font-weight:800}
.ca-label{color:#9c91a4;font-size:.68rem;letter-spacing:.2em;font-weight:800;margin-bottom:8px}
.ca{color:var(--yellow);font-size:.82rem;overflow-wrap:anywhere;text-decoration:none}
.copy{margin-left:8px;padding:5px 9px;border:1px solid #57435f;border-radius:6px;color:#ddd;background:#160d1b}
footer{margin-top:28px;color:#9a8da2;font-size:.72rem;letter-spacing:.15em}
